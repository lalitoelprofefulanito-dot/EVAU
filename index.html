<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVAU · Expediente Vivo de Atención USAER/UDEEI</title>
<meta name="theme-color" content="#0f2f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--azul:#0f2f5c;--azul2:#1b4a8a;--verde:#0b7a3e;--ambar:#b86a00;--rojo:#b3261e;--tinta:#111;--borde:#3d4654;--fondo:#fff;--gris:#eef1f5}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--tinta);background:var(--fondo);line-height:1.5;padding-bottom:6rem}
h1,h2,h3{margin:.2rem 0 .6rem;color:var(--azul);line-height:1.25}
h1{font-size:1.5rem}h2{font-size:1.3rem}h3{font-size:1.1rem}
p{margin:.3rem 0 .7rem}
a{color:var(--azul2);font-weight:bold}
header.barra{background:var(--azul);color:#fff;padding:.6rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
header.barra .marca{font-size:1.4rem;font-weight:bold;letter-spacing:.05em}
header.barra .sub{font-size:.85rem;flex:1;min-width:10rem}
header.barra button{background:#fff;color:var(--azul);border:2px solid #fff}
.aviso-ficticio{background:var(--rojo);color:#fff;font-weight:bold;text-align:center;padding:.35rem .6rem;font-size:.9rem}
nav.menu{display:flex;gap:.3rem;overflow-x:auto;background:var(--gris);padding:.4rem .6rem;border-bottom:2px solid var(--azul);position:sticky;top:0;z-index:5}
nav.menu a{flex:0 0 auto;text-decoration:none;color:var(--azul);background:#fff;border:2px solid var(--azul);border-radius:.5rem;padding:.45rem .8rem;font-size:1rem}
nav.menu a.activo{background:var(--azul);color:#fff}
main{max-width:64rem;margin:0 auto;padding:1rem}
button,.boton{font:inherit;font-weight:bold;cursor:pointer;border:2px solid var(--azul);background:var(--azul);color:#fff;border-radius:.5rem;padding:.55rem .95rem;min-height:2.8rem}
button.sec{background:#fff;color:var(--azul)}
button.peligro{background:var(--rojo);border-color:var(--rojo)}
button.chico{min-height:2.2rem;padding:.3rem .6rem;font-size:.9rem}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #f5a300;outline-offset:2px}
.fila{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.5rem 0}
.sep{flex:1}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.8rem;margin:.8rem 0}
.tarjeta{border:2px solid var(--borde);border-radius:.6rem;padding:.8rem;background:#fff}
a.tarjeta{text-decoration:none;color:var(--tinta);display:block}
a.tarjeta:hover{border-color:var(--azul);background:var(--gris)}
.tarjeta .num{font-size:2.2rem;font-weight:bold;color:var(--azul);line-height:1.1}
.tarjeta .tit{font-weight:bold}
.caja{border:2px solid var(--borde);border-radius:.6rem;padding:.9rem;margin:.8rem 0;background:#fff}
.caja.alerta{border-color:var(--rojo);border-left-width:.6rem}
.caja.ok{border-color:var(--verde);border-left-width:.6rem}
table{border-collapse:collapse;width:100%;margin:.5rem 0;font-size:.95rem}
th,td{border:1.5px solid var(--borde);padding:.4rem .5rem;text-align:left;vertical-align:top}
th{background:var(--azul);color:#fff}
.tabla-scroll{overflow-x:auto}
td.n,th.n{text-align:center}
label{display:block;font-weight:bold;margin:.6rem 0 .2rem}
input,select,textarea{font:inherit;width:100%;padding:.55rem;border:2px solid var(--borde);border-radius:.4rem;background:#fff;color:var(--tinta)}
textarea{min-height:7rem}
td select,td input{padding:.3rem;min-width:4.5rem}
.etq{display:inline-block;border-radius:.4rem;padding:.1rem .5rem;font-weight:bold;font-size:.85rem;color:#fff;background:var(--azul)}
.etq.v{background:var(--verde)}.etq.a{background:var(--ambar)}.etq.r{background:var(--rojo)}.etq.g{background:#3d4654}
.pestanas{display:flex;gap:.3rem;overflow-x:auto;margin:.8rem 0;border-bottom:3px solid var(--azul)}
.pestanas a{flex:0 0 auto;text-decoration:none;padding:.5rem .8rem;border:2px solid var(--azul);border-bottom:none;border-radius:.5rem .5rem 0 0;color:var(--azul);background:#fff}
.pestanas a.activo{background:var(--azul);color:#fff}
.registro{border:2px solid var(--borde);border-left:.6rem solid var(--azul);border-radius:.5rem;padding:.7rem .8rem;margin:.7rem 0}
.registro.anulado{border-left-color:#3d4654;text-decoration:line-through;text-decoration-color:var(--rojo)}
.registro .cab{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;font-weight:bold}
.registro .firma{font-size:.9rem;font-style:italic}
.miniaturas{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.miniaturas img{width:6.5rem;height:6.5rem;object-fit:cover;border:2px solid var(--borde);border-radius:.4rem}
.miniaturas a.arch{border:2px solid var(--azul);border-radius:.4rem;padding:.4rem .6rem;text-decoration:none}
.barra-h{display:grid;grid-template-columns:minmax(7rem,14rem) 1fr 3rem;gap:.5rem;align-items:center;margin:.3rem 0}
.barra-h .b{background:var(--gris);border:1.5px solid var(--borde);height:1.5rem;border-radius:.3rem;overflow:hidden}
.barra-h .b i{display:block;height:100%;background:var(--azul2)}
.barra-h .v{font-weight:bold;text-align:right}
.fab{position:fixed;right:1rem;bottom:1rem;z-index:20;border-radius:2.5rem;padding:.9rem 1.3rem;font-size:1.15rem;background:var(--verde);border-color:var(--verde);box-shadow:0 3px 10px rgba(0,0,0,.45)}
.velo{position:fixed;inset:0;background:rgba(10,20,40,.75);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:1rem}
.modal{background:#fff;border-radius:.7rem;max-width:44rem;width:100%;padding:1.1rem;border:3px solid var(--azul)}
.modal.ancho{max-width:60rem}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:#111;color:#fff;padding:.7rem 1.1rem;border-radius:.5rem;z-index:99;font-weight:bold;max-width:90vw}
.acceso{max-width:26rem;margin:2rem auto;padding:1rem}
.grab{background:var(--rojo)!important;border-color:var(--rojo)!important}
.voz-estado{font-weight:bold;color:var(--rojo)}
.hoja{font-size:14pt;text-align:justify}
.hoja h1{font-size:16pt;text-align:center;color:#000}
.hoja h2{font-size:14pt;color:#000;border-bottom:2px solid #000;margin-top:1rem}
.hoja th{background:#222;color:#fff}
.hoja [contenteditable]{outline:2px dashed var(--azul2);padding:.3rem;min-height:3rem}
.nota{font-size:.92rem;font-weight:bold}

/* 1.1 · carpeta, dictado, documentos y plan */
.buscar-tit{font-size:1.25rem;color:var(--azul);margin-top:0}
input.buscar{font-size:1.2rem;padding:.75rem;border-width:3px;border-color:var(--azul)}
.carpetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.7rem;margin:.8rem 0}
a.carpeta{display:flex;gap:.7rem;align-items:flex-start;text-decoration:none;color:var(--tinta);border:2px solid var(--borde);border-left:.55rem solid var(--azul);border-radius:.6rem;padding:.7rem .8rem;font-weight:normal}
a.carpeta:hover{background:var(--gris)}
a.carpeta .ic{font-size:2rem;line-height:1}
a.carpeta strong{font-size:1.1rem;color:var(--azul)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.3rem 0}
.chips label{display:inline-flex;align-items:center;gap:.4rem;margin:0;border:2px solid var(--azul);border-radius:2rem;padding:.35rem .85rem;cursor:pointer;background:#fff;color:var(--azul)}
.chips label:has(input:checked){background:var(--azul);color:#fff}
.chips input{width:1.25rem;height:1.25rem;margin:0;accent-color:#f5a300}
.chips-col{flex-direction:column;align-items:stretch}
.chips-col label{border-radius:.5rem;align-items:flex-start;font-weight:normal}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
@media(max-width:560px){.dos{grid-template-columns:1fr}}
.voz-caja{background:var(--gris);border-color:var(--azul);margin-top:.4rem}
.voz-caja .nota{margin:.4rem 0 0}
.destino{outline:5px solid #f5a300!important;outline-offset:2px}
.docs{display:flex;flex-wrap:wrap;gap:.4rem .9rem;align-items:center;border:2px solid var(--borde);border-radius:.6rem;padding:.6rem .8rem;margin:.6rem 0;background:#fff}
.docs .doc-item{text-decoration:none;color:var(--tinta);font-weight:bold}
.docs .doc-item.falta{color:var(--rojo)}
.registro.incidencia{border-left-color:var(--rojo)}
.seccion h3{margin:0}
.seccion td,.seccion th{overflow-wrap:anywhere}
.seccion .tabla-scroll{max-width:100%}
.seccion ul,.hoja ul{margin:.2rem 0 .5rem 1.2rem;padding-left:.6rem}
.centro{text-align:center!important}
table.firmas{border:none;margin-top:2.6rem}
table.firmas td{border:none;text-align:center;width:50%;padding:0 1rem}
table.firmas .linea{border-top:2px solid #000;margin:0 auto .3rem;width:85%}
.hoja .portada{text-align:center;font-size:13pt}
.hoja .portada .t-plan{font-size:20pt;font-weight:bold;letter-spacing:.15em;margin:2.2rem 0 1.6rem}
.hoja .portada p{margin:1rem 0}
.hoja .encab{font-size:10.5pt;line-height:1.45;border-bottom:2px solid #000;padding-bottom:4pt;margin-bottom:8pt;text-align:left}
.hoja table.marco,.hoja table.marco>thead>tr>td,.hoja table.marco>tbody>tr>td{border:none;padding:0}
.hoja.plan{font-size:12pt}
.hoja h2{break-after:avoid}
.hoja.plan h2{font-size:12.5pt;text-align:center;border-bottom:none;text-decoration:underline;margin-top:1.1rem}
.hoja.plan td,.hoja.plan th{font-size:11pt}
.hoja.plan p{margin:.2rem 0}
.salto{break-after:page;height:0}
@media screen{.hoja .salto{border-top:3px dashed var(--borde);margin:1.2rem 0;height:0}}
@media print{.hoja{font-size:12pt}.hoja .portada{min-height:22cm}tr,li{break-inside:avoid}}
@media print{
  body{padding:0}
  body>*:not(.velo){display:none!important}
  .velo{position:static;background:#fff;padding:0;display:block}
  .modal{border:none;max-width:none;padding:0}
  .no-imprime{display:none!important}
  .hoja [contenteditable]{outline:none}
  .hoja th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* 1.3 · dictado reutilizable, búsqueda por voz y combinación de respaldos */
.voz-estado{color:var(--azul);min-height:1.2em}
.voz-estado.error{color:var(--rojo)}
.etiqueta-mic{display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.etiqueta-mic label{flex:1;min-width:10rem}
button.mic{margin:.4rem 0 .2rem}
details.guia{border:2px solid var(--azul);border-radius:.5rem;padding:.4rem .8rem;margin:.6rem 0;background:#fff}
details.guia summary{font-weight:bold;color:var(--azul);cursor:pointer;padding:.3rem 0;font-size:1.05rem}
details.guia ol{margin:.4rem 0 .4rem 1.2rem;padding:0}
details.guia li{margin:.25rem 0}
.ejemplo-sale{border:2px dashed var(--azul);border-radius:.4rem;padding:.5rem .7rem;margin:.3rem 0 .6rem}
.buscar-fila{display:flex;gap:.5rem;flex-wrap:wrap}
.buscar-fila input{flex:1 1 14rem;min-width:0}
.buscar-fila button{flex:0 0 auto}
.opcion-resp{display:flex;gap:.8rem;align-items:flex-start;flex-wrap:wrap;margin:.7rem 0;padding:.6rem 0;border-top:1.5px solid var(--borde)}
.opcion-resp > button,.opcion-resp > label.boton{flex:0 0 auto;min-width:15rem;text-align:center}
.opcion-resp p{flex:1 1 16rem;margin:0}
ul.resumen-comb li{margin:.35rem 0;font-size:1.05rem}
label.boton{display:inline-block}
.boton.peligro{background:var(--rojo);border-color:var(--rojo)}

</style>
</head>
<body>
<noscript>EVAU necesita JavaScript activado.</noscript>
<script>
'use strict';
/* EVAU · Expediente Vivo de Atención USAER/UDEEI · núcleo: utilidades, catálogos, almacenamiento y dictado */
const VERSION = '1.3.1';
const CLAVE = '0000';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const p2 = n => String(n).padStart(2, '0');
const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const ahora = () => { const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fcorta = f => f ? f.slice(8, 10) + '/' + f.slice(5, 7) + '/' + f.slice(0, 4) : '';
const fdm = f => f ? Number(f.slice(8, 10)) + ' ' + MESES[Number(f.slice(5, 7)) - 1].slice(0, 3) : '';
const flarga = f => f ? Number(f.slice(8, 10)) + ' de ' + MESES[Number(f.slice(5, 7)) - 1] + ' de ' + f.slice(0, 4) : '';
const lineas = t => String(t || '').split('\n').map(s => s.trim()).filter(Boolean);
function edad(fn) {
  if (!fn) return '';
  const h = new Date(), n = new Date(fn + 'T12:00:00');
  let a = h.getFullYear() - n.getFullYear(), m = h.getMonth() - n.getMonth();
  if (h.getDate() < n.getDate()) m--;
  if (m < 0) { a--; m += 12; }
  return a + ' años ' + m + ' meses';
}

/* ---------- Catálogos ----------
   Plan de intervención: estructura del formato «Plan de Intervención Educativa» que usa la USAER (apartados, áreas y tipos).
   Estadística: estructura del cuestionario 911 USAER-1 más las tres categorías «Problemas severos…» que la USAER usa en su estadística
   para alumnos sin diagnóstico. Lo demás son modelos de uso común, no oficiales. */
const CAT = {
  roles: { apoyo: 'Maestra/o de apoyo', psicologia: 'Psicología', comunicacion: 'Comunicación', direccion: 'Dirección (consulta y carpeta general)' },
  turnos: ['Matutino', 'Vespertino', 'Jornada ampliada', 'Tiempo completo'],
  grados: ['1°', '2°', '3°', '4°', '5°', '6°'],
  tiposRegistro: ['Apoyo individual', 'Acompañamiento en aula', 'Asesoría a docente', 'Orientación a familia', 'Entrevista', 'Seguimiento', 'Observación', 'Incidencia', 'Canalización'],
  condiciones: ['En detección (sin condición identificada)', 'Ceguera', 'Baja visión', 'Sordera', 'Hipoacusia', 'Discapacidad motriz', 'Discapacidad intelectual', 'Aptitudes sobresalientes', 'Discapacidad psicosocial', 'Sordoceguera', 'Trastorno del espectro autista', 'Discapacidad múltiple', 'TDAH', 'Otras condiciones', 'Problemas severos de comunicación', 'Problemas severos de conducta', 'Problemas severos de aprendizaje'],
  /* Alumnos sin diagnóstico: no llevan plan de intervención ni evaluación psicopedagógica, solo informe final del ciclo */
  sinDiagnostico: ['En detección (sin condición identificada)', 'Problemas severos de comunicación', 'Problemas severos de conducta', 'Problemas severos de aprendizaje'],
  /* Formato del plan de intervención */
  areas: ['Cognoscitiva', 'Motrices', 'Sociales', 'Afectivas', 'Académicas', 'Comunicativo-lingüística', 'Independencia y autocuidado'],
  bapCats: ['Del contexto físico y sensorial', 'Metodológicas o didácticas', 'Organizativas', 'Actitudinales', 'Sociofamiliares'],
  aula: ['Ambientales', 'Organizativas', 'Espaciales', 'Comunicativas', 'Sensoriales', 'Para la participación'],
  apoyos: ['Apoyo personal', 'Apoyos visuales', 'Material didáctico', 'Materiales sensoriales', 'Vinculación con instituciones externas'],
  curriculo: ['Metodología', 'Evaluación', 'Procesos de desarrollo de aprendizaje'],
  fases: ['Fase 2', 'Fase 3', 'Fase 4', 'Fase 5', 'Fase 6'],
  campos: ['Lenguajes', 'Saberes y Pensamiento Científico', 'Ética, Naturaleza y Sociedades', 'De lo Humano y lo Comunitario'],
  cortes: ['Noviembre', 'Marzo', 'Junio'],
  necesidadesPadres: [
    'Necesitan información clara y precisa sobre la condición de su hija o hijo para comprender mejor sus características (pláticas, conferencias, talleres).',
    'Necesitan asesoría para implementar un sistema alternativo de comunicación que favorezca las habilidades comunicativas y lingüísticas de su hija o hijo.',
    'Necesitan orientación sobre estrategias de conducta para incidir positivamente en el comportamiento de su hija o hijo y evitar situaciones de conflicto.',
    'Necesitan asesoría para diseñar e implementar materiales específicos de apoyo a las necesidades escolares.',
    'Necesitan vincularse con otras instituciones que apoyen el aprendizaje escolar y la participación de su hija o hijo en la vida cotidiana.'
  ],
  /* Registro diario */
  nivelesApoyo: ['Ayuda total', 'Modelado', 'Indicación verbal', 'Recordatorio visual', 'Independiente'],
  marcas: ['Logro', 'Dificultad', 'Apoyo brindado'],
  /* Bitácora de incidencia */
  incClasif: ['Agresión física', 'Agresión verbal', 'Accidente escolar', 'Daño material', 'Abandono de lugar sin autorización', 'Desobediencia a indicaciones'],
  incAntec: ['Llamada de atención verbal', 'Diálogo con el alumno', 'Reincidencia', 'Compromisos no cumplidos'],
  docTipos: ['Consentimiento informado', 'Plan de intervención', 'Informe de evaluación psicopedagógica', 'Informe psicológico', 'Informe de comunicación', 'Informe final', 'Documento médico o diagnóstico', 'Informe de especialista externo', 'Otro'],
  tiposInforme: ['Seguimiento — corte de noviembre', 'Seguimiento — corte de marzo', 'Seguimiento — corte de junio', 'Final del ciclo', 'Para la familia'],
  /* Valoración (modelo F04, no oficial) */
  componentes: ['Competencia curricular — Lenguajes', 'Competencia curricular — Saberes y Pensamiento Científico', 'Competencia curricular — Ética, Naturaleza y Sociedades', 'Competencia curricular — De lo Humano y lo Comunitario', 'Área cognitiva', 'Área afectivo-emocional / socio-adaptativa', 'Área lingüístico-comunicativa', 'Área motriz', 'Estilo de aprendizaje, intereses y motivación'],
  escala: { '': '—', L: 'Logrado', P: 'En proceso', R: 'Requiere apoyo' }
};
const colorMarca = m => ({ Logro: 'v', Dificultad: 'r', 'Apoyo brindado': 'a' }[m] || 'g');

/* ---------- Estado ---------- */
function planVacio() {
  const o = { datosGenerales: '', areas: {}, bap: {}, aula: {}, apoyos: {}, curriculo: {}, curriculares: [], registroEval: {}, necesidades: [], necesidadesOtras: '', compromisos: [], final: { avanzo: '', promocion: '', razones: '', destino: '' }, participantes: [], actualizado: '' };
  CAT.areas.forEach(a => o.areas[a] = { fortalezas: [], oportunidades: [] });
  CAT.bapCats.forEach(c => o.bap[c] = []);
  CAT.aula.forEach(c => o.aula[c] = { adecuacion: '', responsables: '' });
  CAT.apoyos.forEach(c => o.apoyos[c] = { adecuacion: '', responsables: '' });
  CAT.curriculo.forEach(c => o.curriculo[c] = []);
  CAT.cortes.forEach(c => o.registroEval[c] = { logros: '', padres: '' });
  return o;
}
function estadoVacio() {
  return {
    version: 2,
    config: { ciclo: '2026-2027', servicio: 'USAER/UDEEI «Unidad Ejemplo» · CCT 00FUA0000Z (ficticia)' },
    usaer: { unidad: 'UNIDAD DE SERVICIO DE APOYO A LA EDUCACIÓN REGULAR U.S.A.E.R. NÚM. 0000', cct: '00FUA0000Z', turno: 'MATUTINO', domicilio: 'CALLE FICTICIA S/N, COLONIA EJEMPLO, C.P. 00000', directora: 'Dir. USAER Ficticio', encabezado: 'CONDICIÓN DEL ALUMNO:' },
    usuarios: [
      { id: 'u1', nombre: 'Mtra. Apoyo Ficticio', rol: 'apoyo' },
      { id: 'u2', nombre: 'Psic. Psicología Ficticio', rol: 'psicologia' },
      { id: 'u3', nombre: 'Mtra. Comunicación Ficticio', rol: 'comunicacion' },
      { id: 'u4', nombre: 'Dir. Dirección Ficticio', rol: 'direccion' }
    ],
    escuelas: [], grupos: [], alumnos: [], registros: [], evidencias: [], documentos: [],
    valoraciones: {}, planes: {}, informes: [], bitacora: [], borrados: []
  };
}
/* Convierte datos o respaldos de la versión 1.0 al formato del plan real (no se pierde nada) */
function migrar(d) {
  const base = estadoVacio();
  d = Object.assign(base, d);
  d.usaer = Object.assign(estadoVacio().usaer, d.usaer || {});
  (d.documentos || []).forEach(x => { if (x.tipo === 'Evaluación psicopedagógica') x.tipo = 'Informe de evaluación psicopedagógica'; });
  if ((d.version || 1) >= 2 && !Array.isArray(d.planes)) return d;

/* Patrón 1 · el dictador. op = { caja, cajas, separador, tomarBase, escribir, alEstado, alEncender, alApagar }
   · caja: dónde se escribe; cajas: todas las que, si se corrigen a mano, hacen que lo siguiente se agregue después.
   · escribir(frases, base): para pantallas que reparten lo dictado (registro de un toque). Por omisión, se agrega a la caja. */
let DICTADOR = null;
function detenerVoz() { if (DICTADOR) DICTADOR.apagar(); }
function encenderDictado(op) {
  detenerVoz();
  const lugar = lugarParaDictar();
  const estado = (t, err) => op.alEstado && op.alEstado(t, !!err);
  if (!lugar.SR) { estado(MSG_VOZ[lugar.motivo], true); if (op.caja) op.caja.focus(); return null; }
  const cajas = op.cajas || [op.caja], sep = op.separador ?? ' ';
  const tomarBase = op.tomarBase || (() => op.caja.value);
  const e = { quiere: true, activo: false, cerrado: false, rec: null, base: tomarBase(), previas: [], sesion: [], desde: 0, largo: 0, fallos: 0, motivo: '', reloj: null, crono: null, prov: '', t0: Date.now(), ultimaVoz: Date.now(), escribiendo: false };
  const escribir = () => {
    const frases = unirFrases(e.previas.concat(e.sesion));
    e.escribiendo = true;
    if (op.escribir) op.escribir(frases, e.base); else op.caja.value = componer(e.base, frases, sep);
    e.escribiendo = false;
  };
  /* Respeta lo corregido a mano: lo que ya está en las cajas pasa a ser la base y lo siguiente se agrega después */
  const rebase = () => { if (e.escribiendo) return; e.base = tomarBase(); e.previas = []; e.sesion = []; e.desde = e.largo; };
  cajas.forEach(c => c && c.addEventListener('input', rebase));
  const ctl = {
    caja: op.caja,
    rebase,
    apagar(motivo) {
      e.quiere = false; clearTimeout(e.reloj);
      if (e.activo && e.rec) { e.motivoFinal = motivo; try { e.rec.stop(); } catch (x) { terminar(motivo); } }
      else terminar(motivo);
    }
  };
  function terminar(motivo) {
    if (e.cerrado) return; e.cerrado = true;
    clearInterval(e.crono); cajas.forEach(c => c && c.removeEventListener('input', rebase));
    if (DICTADOR === ctl) DICTADOR = null;
    if (motivo && MSG_VOZ[motivo]) estado(MSG_VOZ[motivo], true); else estado('Dictado terminado. Revise el texto: puede corregirlo a mano.');
    if (op.alApagar) op.alApagar(motivo);
  }
  function arrancar() {
    if (!e.quiere) return terminar();
    const rec = new lugar.SR(); e.rec = rec;
    rec.lang = 'es-MX'; rec.continuous = true; rec.interimResults = !enAndroid;   // en Android los provisionales llegan duplicados
    e.desde = 0; e.largo = 0; e.sesion = [];
    rec.onstart = () => { e.activo = true; e.motivo = ''; };
    rec.onresult = ev => {
      const frases = []; let prov = '';
      for (let k = e.desde; k < ev.results.length; k++) {
        const f = String(ev.results[k][0].transcript || '').trim(); if (!f) continue;
        if (!ev.results[k].isFinal) { prov += ' ' + f; continue; }             // los provisionales solo se muestran
        frases.push(f);
      }
      e.largo = ev.results.length; e.prov = prov.trim(); e.ultimaVoz = Date.now(); e.fallos = 0;
      const antes = e.sesion.join('|'); e.sesion = frases;
      if (frases.join('|') !== antes) escribir();
    };
    rec.onerror = ev => { e.motivo = ev.error; if (ev.error !== 'no-speech' && ev.error !== 'aborted') e.fallos++; };
    rec.onend = () => {
      e.activo = false; e.previas = unirFrases(e.previas.concat(e.sesion)); e.sesion = []; e.prov = '';
      if (!e.quiere) return terminar(e.motivoFinal);
      if (FATALES.includes(e.motivo)) { e.quiere = false; return terminar(e.motivo); }
      if (e.fallos >= 4) { e.quiere = false; return terminar(e.motivo === 'network' ? 'network' : 'falla'); }
      if (Date.now() - e.ultimaVoz > 60000) { e.quiere = false; return terminar('silencio'); }
      e.reloj = setTimeout(arrancar, 250);                                        // se vuelve a encender sola
    };
    try { rec.start(); } catch (x) { e.fallos++; e.reloj = setTimeout(() => e.fallos >= 4 ? (e.quiere = false, terminar('falla')) : arrancar(), 400); }
  }
  DICTADOR = ctl;
  e.crono = setInterval(() => { const s = Math.floor((Date.now() - e.t0) / 1000); estado('🎙 Escuchando ' + p2(Math.floor(s / 60)) + ':' + p2(s % 60) + (e.prov ? ' · «' + e.prov + '»' : ' · hable con pausas')); }, 400);
  estado('🎙 Escuchando · hable con pausas');
  if (op.alEncender) op.alEncender();
  arrancar();
  return ctl;
}
/* Botón de micrófono que se pone y se quita (un solo dictado a la vez en toda la app) */
function botonMicrofono(boton, op) {
  const texto = boton.textContent;
  boton.onclick = () => {
    if (DICTADOR && boton.classList.contains('grab')) { detenerVoz(); return; }
    encenderDictado(Object.assign({}, op, {
      alEncender: () => { boton.classList.add('grab'); boton.textContent = '⏹ Detener'; op.alEncender && op.alEncender(); },
      alApagar: m => { boton.classList.remove('grab'); boton.textContent = texto; op.alApagar && op.alApagar(m); }
    }));
  };
}

/* Registro de un toque: dicta actividad y observación con un solo botón */
function dictarRegistro(act, obs, boton, estado, cambiar) {
  if (DICTADOR) { detenerVoz(); return; }
  let modo = act.value.trim() ? 'obs' : 'act', ctl = null;
  const marcar = () => { act.classList.toggle('destino', !!DICTADOR && modo === 'act'); obs.classList.toggle('destino', !!DICTADOR && modo === 'obs'); if (cambiar) cambiar.disabled = !DICTADOR || modo === 'obs'; };
  ctl = encenderDictado({
    caja: obs, cajas: [act, obs],
    tomarBase: () => { if (act.value.trim()) modo = 'obs'; return { act: act.value, obs: obs.value, modo }; },
    escribir: (frases, base) => { const r = repartirDictado(frases, base); act.value = r.act; obs.value = r.obs; if (frases.length) modo = 'obs'; marcar(); },
    alEstado: (t, err) => { estado.textContent = t; estado.classList.toggle('error', err); },
    alEncender: () => { boton.classList.add('grab'); boton.textContent = '⏹ Detener dictado'; },
    alApagar: () => { boton.classList.remove('grab'); boton.textContent = '🎙 Dictar'; marcar(); }
  });
  if (cambiar) cambiar.onclick = () => { modo = 'obs'; if (ctl) ctl.rebase(); marcar(); };
  marcar();
}

/* Patrón 3 · encontrar en una lista lo que se dijo, aunque se diga mal o incompleto.
   Clave fonética del español (b=v, c=s=z, qu=k, ll=y, h muda), distancia de edición (parecido de al menos 72 %),
   peso de las palabras raras (log(1 + N/n)) y prudencia: solo se elige si el puntaje pasa de 0.7 y le saca 0.1 al segundo. */
const PALABRAS_VACIAS = new Set(['de', 'del', 'la', 'las', 'el', 'los', 'y', 'e', 'a', 'en', 'con', 'por', 'para', 'un', 'una', 'al']);
function claveFonetica(p) {
  return sinAcentos(p).replace(/ñ/g, 'ny').replace(/ch/g, '§').replace(/ll/g, 'y').replace(/qu/g, 'k').replace(/c([ei])/g, 's$1').replace(/g([ei])/g, 'j$1')
    .replace(/z/g, 's').replace(/c/g, 'k').replace(/v/g, 'b').replace(/w/g, 'u').replace(/h/g, '').replace(/y$/, 'i').replace(/(.)\1+/g, '$1').replace(/§/g, 'ch');
}
function distanciaEdicion(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
const parecido = (a, b) => a === b ? 1 : 1 - distanciaEdicion(a, b) / Math.max(a.length, b.length);
function buscarPorVoz(dicho, lista) {
  const items = lista.map(x => typeof x === 'string' ? { texto: x } : x).map(x => Object.assign({}, x, { claves: palabrasDe(x.texto).filter(p => !PALABRAS_VACIAS.has(p)).map(claveFonetica) }));
  const q = palabrasDe(dicho).filter(p => !PALABRAS_VACIAS.has(p)).map(claveFonetica);
  if (!q.length || !items.length) return { estado: 'no', elegido: null, candidatos: [] };
  const N = items.length, n = {};
  items.forEach(it => new Set(it.claves).forEach(k => n[k] = (n[k] || 0) + 1));
  const peso = k => Math.log(1 + N / (n[k] || 1));
  const puntajes = items.map(it => {
    let arriba = 0, abajo = 0;
    q.forEach(w => {
      let mejor = 0, cual = null;
      it.claves.forEach(k => { const s = parecido(w, k); if (s > mejor) { mejor = s; cual = k; } });
      if (mejor < 0.72) { mejor = 0; cual = null; }
      const pw = cual ? peso(cual) : Math.log(1 + N);
      arriba += mejor * pw; abajo += pw;
    });
    return { texto: it.texto, id: it.id, puntaje: Math.round(arriba / abajo * 100) / 100 };
  }).sort((a, b) => b.puntaje - a.puntaje);
  const [p1, p2_] = puntajes, segundo = p2_ ? p2_.puntaje : 0;
  if (p1.puntaje > 0.7 && p1.puntaje - segundo >= 0.1) return { estado: 'ok', elegido: p1, candidatos: [p1] };
  const cand = puntajes.filter(x => x.puntaje >= 0.45 && x.puntaje >= p1.puntaje - 0.25).slice(0, 5);
  return cand.length ? { estado: 'duda', elegido: null, candidatos: cand } : { estado: 'no', elegido: null, candidatos: [] };
}

}

  v.innerHTML = `<label for="q" class="buscar-tit">🔎 Buscar alumno</label>
  <div class="buscar-fila"><input id="q" type="search" class="buscar" placeholder="Escriba o diga el nombre" autocomplete="off"><button id="qvoz" class="sec" type="button" aria-label="Buscar diciendo el nombre">🎙 Decir el nombre</button></div><p id="qest" class="voz-estado" role="status"></p>

  <select id="fs" aria-label="Estatus" style="flex:1;min-width:9rem"><option value="Activo">En atención</option><option value="">Todos</option><option value="Baja">Baja</option><option value="Egresado">Egresados</option></select>
  ${ed('<button id="nuevo" class="sec">＋ Nuevo alumno</button>')}</div><div id="lista" class="carpetas"></div>`;
  let soloIds = null;   // cuando la búsqueda por voz duda, se muestran solo los candidatos
  const enFiltro = a => (!$('#fe').value || a.escuelaId === $('#fe').value) && (!$('#fs').value || a.estatus === $('#fs').value);
  const lista = () => {
    const q = $('#q').value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const xs = DB.alumnos.filter(a => (soloIds ? soloIds.includes(a.id) : a.nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q)) && enFiltro(a)).sort((a, b) => a.nombre.localeCompare(b.nombre));
    $('#lista').innerHTML = xs.map(a => {
      const u = ultimoRegistro(a.id), c = (a.consentimiento || {}).estado === 'Activo';
      return `<a class="carpeta" href="#alumno/${a.id}"><span class="ic" aria-hidden="true">📂</span><span class="tx"><strong>${esc(a.nombre)}</strong><br>${esc(nomGrupo(porId('grupos', a.grupoId)))} · ${esc(condicionVisible(a))}<br><span class="nota">${u ? 'Último registro: ' + esc(flarga(u)) : 'Sin registros'}${c ? '' : ' · <span class="etq r">Sin consentimiento</span>'}</span></span></a>`;
    }).join('') || '<p>No hay alumnos con esos datos.</p>';
  };
  ['q', 'fe', 'fs'].forEach(i => $('#' + i).oninput = () => { soloIds = null; lista(); }); lista();
  const qest = (t, err) => { $('#qest').textContent = t; $('#qest').classList.toggle('error', !!err); };
  /* Patrón 3: se dice el nombre (aunque sea mal o incompleto) y EVAU busca el alumno que corresponde */
  const resolver = dicho => {
    const r = buscarPorVoz(dicho, DB.alumnos.filter(enFiltro).map(a => ({ texto: a.nombre, id: a.id })));
    if (r.estado === 'ok') { soloIds = null; $('#q').value = r.elegido.texto; qest('Encontrado: ' + r.elegido.texto + '. Toque su carpeta para abrirla.'); }
    else if (r.estado === 'duda') { soloIds = r.candidatos.map(c => c.id); $('#q').value = ''; qest('Se escuchó «' + dicho + '». Hay más de un nombre parecido: elija el correcto.'); }
    else { soloIds = null; $('#q').value = ''; qest('Se escuchó «' + dicho + '», pero no está en la lista. Intente de nuevo o escriba el nombre.', true); }
    lista();
  };
  botonMicrofono($('#qvoz'), { caja: $('#q'), alEstado: (t, err) => qest(t, err), escribir: frases => { const dicho = frases.join(' ').trim(); if (dicho) { detenerVoz(); resolver(dicho); } } });

    if (!DB.grupos.length) { aviso('Primero registre una escuela y un grupo.'); return; }

  };
}

function pintarRegistros(cont, regs) {
  cont.innerHTML = regs.map(r => {
    const evs = DB.evidencias.filter(x => x.registroId === r.id), g = !!r.grupoId, inc = r.tipo === 'Incidencia', esc_ = !!r.escuelaId;

    <p><strong>${esc_ ? 'Asunto' : g || inc ? 'Situación' : 'Actividad'}:</strong> ${esc(r.actividad)}</p>
    <p><strong>${esc_ ? 'Notas' : g || inc ? 'Intervención' : 'Observación'}:</strong> ${esc(r.observacion)}</p>
    ${r.nivel ? `<p><strong>Nivel de apoyo:</strong> ${esc(r.nivel)}</p>` : ''}
    ${r.inc ? `<p><strong>Clasificación:</strong> ${esc((r.inc.clasif || []).join(', ') || '—')}${(r.inc.antec || []).length ? ' · <strong>Antecedentes:</strong> ' + esc(r.inc.antec.join(', ')) : ''}${r.inc.acuerdos ? '<br><strong>Acuerdos:</strong> ' + esc(r.inc.acuerdos) : ''}</p>` : ''}
    ${r.anulado ? `<p><strong>Motivo de anulación:</strong> ${esc(r.motivo)}</p>` : ''}
    <div class="firma">Registró: ${esc(nomUsuario(r.usuarioId))} (${esc(rolUsuario(r.usuarioId))})</div>
    <div class="miniaturas" data-evs="${evs.map(x => x.id).join(',')}"></div>
    <div class="fila">${inc && !r.anulado ? `<button class="sec chico" data-bit="${r.id}">🖨 Bitácora de incidencia</button>` : ''}${!r.anulado && (puedeEditar() || esc_) && r.usuarioId === USUARIO.id ? `<button class="sec chico" data-anular="${r.id}">Anular registro</button>` : ''}</div></div>`;
  }).join('') || '<p>Todavía no hay registros. Use el botón verde «🎙 Nuevo registro».</p>';
  cont.querySelectorAll('[data-evs]').forEach(pintarMiniaturas);
  cont.querySelectorAll('[data-bit]').forEach(b => b.onclick = () => verBitacora(porId('registros', b.dataset.bit)));

async function pintarMiniaturas(div) {
  for (const id of div.dataset.evs.split(',').filter(Boolean)) {
    const m = porId('evidencias', id) || porId('documentos', id), blob = await leerArchivo(id); if (!m) continue;

/* ---------- Estadística (estructura del cuestionario 911 USAER-1) ---------- */
function tablaEstadistica(escuelaId) {
  const xs = activos().filter(a => !escuelaId || a.escuelaId === escuelaId);
  const filas = CAT.condiciones.map(c => {
    const fila = [c]; let tot = 0;
    for (const g of CAT.grados) for (const s of ['H', 'M']) { const n = xs.filter(a => a.condicion === c && a.sexo === s && (porId('grupos', a.grupoId) || {}).grado === g).length; fila.push(n); tot += n; }
    fila.push(tot); return fila;
  });
  const total = ['Total']; for (let i = 1; i <= 13; i++) total.push(filas.reduce((s, f) => s + f[i], 0));
  return { enc: ['Condición', ...CAT.grados.flatMap(g => [g + ' H', g + ' M']), 'Total'], filas: [...filas, total] };
}

async function leerRespaldo(file) {

function cajaDocumentos(a) {

  const finalAnt = docs.some(d => d.tipo === 'Informe final' && d.ciclo === prev);

/* ---------- Análisis de los registros de un periodo ---------- */
function periodoCorte(nombre) {
  const c = ciclo();
  return { Noviembre: [c.ini, c.a + '-11-30'], Marzo: [c.a + '-12-01', c.b + '-03-31'], Junio: [c.b + '-04-01', c.fin] }[nombre];
}
function periodoInforme(tipo) {
  const c = ciclo();
  if (tipo.includes('noviembre')) return periodoCorte('Noviembre');
  if (tipo.includes('marzo')) return periodoCorte('Marzo');
  if (tipo.includes('junio')) return periodoCorte('Junio');
  return [c.ini, hoy() < c.fin ? hoy() : c.fin];
}
function analizar(a, desde, hasta) {
  const regs = DB.registros.filter(r => r.alumnoId === a.id && !r.anulado && r.fecha >= desde && r.fecha <= hasta).sort((x, y) => (x.fecha + x.hora).localeCompare(y.fecha + y.hora));
  const con = m => regs.filter(r => (r.marcas || []).includes(m));
  const area = r => r.area || 'Sin área';
  const agrupar = xs => { const o = {}; xs.forEach(r => (o[area(r)] = o[area(r)] || []).push(r)); return o; };
  const dif = agrupar(con('Dificultad'));
  const persistentes = Object.entries(dif).filter(([, rs]) => rs.length >= 2).map(([k, rs]) => ({ area: k, rs }));
  const ocasionales = Object.entries(dif).filter(([, rs]) => rs.length < 2).map(([k, rs]) => ({ area: k, rs }));
  const evol = Object.entries(agrupar(regs)).map(([k, rs]) => {
    const ns = rs.filter(r => r.nivel); if (ns.length < 2) return null;
    const i = CAT.nivelesApoyo.indexOf(ns[0].nivel), f = CAT.nivelesApoyo.indexOf(ns[ns.length - 1].nivel);
    return { area: k, de: ns[0], a: ns[ns.length - 1], sentido: f > i ? 'menos' : f < i ? 'mas' : 'igual', n: ns.length };
  }).filter(Boolean);
  return { regs, logros: agrupar(con('Logro')), persistentes, ocasionales, apoyos: con('Apoyo brindado'), evol, familia: regs.filter(r => r.tipo === 'Orientación a familia'), sinMarca: regs.filter(r => !(r.marcas || []).length && r.tipo !== 'Orientación a familia') };
}
const vineta = r => `${fdm(r.fecha)}: ${r.observacion || r.actividad}`;
function textoEvol(x) {
  return x.sentido === 'menos' ? `${x.area}: pasó de «${x.de.nivel}» (${fdm(x.de.fecha)}) a «${x.a.nivel}» (${fdm(x.a.fecha)}); necesita menos apoyo.`
    : x.sentido === 'mas' ? `${x.area}: pasó de «${x.de.nivel}» (${fdm(x.de.fecha)}) a «${x.a.nivel}» (${fdm(x.a.fecha)}); necesitó más apoyo al final del periodo.`
      : `${x.area}: se mantiene en «${x.a.nivel}» (${x.n} registros).`;
}
function recomendaciones(an) {
  const r = [];
  an.persistentes.forEach(p => r.push(`Continuar trabajando en el área ${p.area}: ${p.rs[p.rs.length - 1].observacion}`));
  an.evol.filter(x => x.sentido === 'menos' && x.a.nivel === 'Independiente').forEach(x => r.push(`Retirar gradualmente el apoyo en el área ${x.area}, donde ya trabaja de forma independiente.`));
  an.evol.filter(x => x.sentido === 'mas').forEach(x => r.push(`Revisar los apoyos del área ${x.area}: requirió más ayuda al final del periodo.`));
  return r;
}
function propuestaCorte(a, corte) {
  const [d, h] = periodoCorte(corte), an = analizar(a, d, h);
  const L = [];
  const logros = Object.values(an.logros).flat().sort((x, y) => x.fecha.localeCompare(y.fecha));
  if (logros.length) L.push('Logros:', ...logros.map(r => '• ' + vineta(r)));
  const difs = [...an.persistentes, ...an.ocasionales].flatMap(p => p.rs).sort((x, y) => x.fecha.localeCompare(y.fecha));
  if (difs.length) L.push('Dificultades:', ...difs.map(r => '• ' + vineta(r)));
  if (an.evol.length) L.push('Nivel de apoyo:', ...an.evol.map(x => '• ' + textoEvol(x)));
  return { logros: L.join('\n') || 'No hay registros marcados en este periodo.', padres: an.familia.map(r => '• ' + vineta(r)).join('\n') || 'Sin registros de orientación a la familia en este periodo.', n: an.regs.length };
}

/* Revisión rápida: reglas tomadas de la revisión del plan */
function revisarPlan(a, p) {
  const obs = [], nombre = a.nombre.split(' ')[0].toLowerCase();
  const todo = [p.datosGenerales, ...Object.values(p.areas).flatMap(x => [...x.fortalezas, ...x.oportunidades]), ...Object.values(p.bap).flat(), ...Object.values(p.aula).map(x => x.adecuacion), ...Object.values(p.apoyos).map(x => x.adecuacion)].join('\n');
  if (/\[(especificar|confirmar)/i.test(todo)) obs.push(['Pendientes', 'Hay textos marcados como [ESPECIFICAR] o [CONFIRMAR] sin resolver.']);
  if (!lineas(p.datosGenerales).length) obs.push(['Datos generales', 'Falta redactar los datos generales.']);
  else if (Object.values(p.bap['Del contexto físico y sensorial']).length && !/(aula|sal[oó]n|escuela|espacio)/i.test(p.datosGenerales)) obs.push(['Datos generales', 'Hay barreras del contexto físico, pero los datos generales no describen el aula ni la escuela.']);
  const vistos = new Map();
  CAT.areas.forEach(ar => {
    const x = p.areas[ar];
    x.oportunidades.forEach(o => {
      const pal = (o.match(/^[\s¿¡"«]*([A-Za-zÁÉÍÓÚÑáéíóúñ]+)/) || [])[1] || '';
      if (!/(ar|er|ir|arse|erse|irse)$/i.test(pal)) obs.push(['Área ' + ar, `«${o}» debería empezar con verbo (Favorecer, Fortalecer, Regular…).`]);
      if (/\((.*(pictograma|agenda|reloj|caja|tarjeta|material).*)\)/i.test(o)) obs.push(['Área ' + ar, `«${o}» incluye una estrategia entre paréntesis; el «cómo» va en adecuaciones y apoyos.`]);
    });
    [...x.fortalezas, ...x.oportunidades].forEach(t => { const k = t.toLowerCase().replace(/[^a-záéíóúñ ]/g, '').trim(); if (vistos.has(k) && vistos.get(k) !== ar) obs.push(['Repetición', `«${t}» aparece en ${vistos.get(k)} y en ${ar}.`]); else vistos.set(k, ar); });
    if (!x.fortalezas.length && !x.oportunidades.length) obs.push(['Área ' + ar, 'Está vacía.']);
  });
  CAT.bapCats.forEach(c => p.bap[c].forEach(b => { if (b.toLowerCase().includes(nombre) || /\b(no tolera|le cuesta|no puede|presenta|su diagn[oó]stico|el alumno|la alumna)\b/i.test(b)) obs.push(['Barreras', `«${b}» parece describir al alumno, no al contexto. Puede ser área de oportunidad.`]); }));
  const nBap = Object.values(p.bap).flat().length, nAcc = [...Object.values(p.aula), ...Object.values(p.apoyos)].filter(x => x.adecuacion).length;
  if (nAcc && !nBap) obs.push(['Cadena del plan', 'Hay adecuaciones, pero ninguna barrera que las justifique.']);
  if (p.bap['Metodológicas o didácticas'].length === 0 && (p.aula['Comunicativas'].adecuacion || p.curriculo['Metodología'].length)) obs.push(['Cadena del plan', 'Se proponen adecuaciones comunicativas o de metodología, pero no hay barreras metodológicas o didácticas nombradas.']);
  [...Object.entries(p.aula), ...Object.entries(p.apoyos)].forEach(([t, x]) => { if (x.adecuacion && !x.responsables) obs.push(['Adecuaciones', `«${t}» no tiene responsables.`]); });
  return obs;
}

function armarInforme(a, tipo, desde, hasta) {
  const g = porId('grupos', a.grupoId), e = porId('escuelas', a.escuelaId) || {}, fam = tipo === 'Para la familia', p = DB.planes[a.id];
  const an = analizar(a, desde, hasta), nEv = DB.evidencias.filter(x => an.regs.some(r => r.id === x.registroId)).length;
  const vacio = txt => `<p><em>${txt}</em></p>`;
  const fila = (k, v1, k2, v2) => `<tr><th>${k}</th><td>${esc(v1 || '')}</td><th>${k2}</th><td>${esc(v2 || '')}</td></tr>`;
  const porAreaHTML = obj => Object.entries(obj).map(([ar, rs]) => `<p><strong>${esc(ar)}</strong></p>${ul(rs.map(vineta))}`).join('');
  let n = 1; const h = t => `<h2>${n++}. ${t}</h2>`;
  let s = `<h1>${fam ? 'INFORME PARA LA FAMILIA' : 'INFORME DE SEGUIMIENTO DEL ALUMNO'}<br>${fam ? '' : esc(tipo.replace('Seguimiento — ', '').toUpperCase())}</h1>
  <p style="text-align:center"><strong>Elaborado con el registro cronológico · formato de uso común (no oficial) · datos ficticios de prueba</strong></p>
  ${h('Datos de identificación')}<table>${fila('Escuela', e.nombre, 'CCT', e.cct)}${fila('Servicio de apoyo', DB.usaer.unidad, 'Ciclo escolar', DB.config.ciclo)}${fila('Alumno', a.nombre, 'Grado y grupo', nomGrupo(g))}${fila('Periodo', 'Del ' + flarga(desde) + ' al ' + flarga(hasta), 'Registros analizados', String(an.regs.length))}${fila('Elaboró', USUARIO.nombre, 'Fecha', flarga(hoy()))}</table>`;
  if (fam) {
    s += h('Lo que ha logrado') + (Object.keys(an.logros).length ? porAreaHTML(an.logros) : vacio('No hay logros marcados en el periodo.'));
    s += h('En qué seguimos trabajando') + (an.persistentes.length + an.ocasionales.length ? ul([...an.persistentes, ...an.ocasionales].map(x => x.area + ': ' + x.rs[x.rs.length - 1].observacion)) : vacio('Sin dificultades marcadas.'));
    s += h('Cómo puede apoyar en casa') + '<div contenteditable="true">Escriba aquí dos o tres sugerencias sencillas.</div>';
  } else {
    s += h('Fortalezas observadas') + (Object.keys(an.logros).length ? porAreaHTML(an.logros) : vacio('No hay registros marcados como logro en el periodo.'));
    s += h('Dificultades persistentes') + (an.persistentes.length ? an.persistentes.map(x => `<p><strong>${esc(x.area)}</strong> (${x.rs.length} registros)</p>${ul(x.rs.map(vineta))}`).join('') : vacio('Ninguna dificultad se repitió en el periodo.')) + (an.ocasionales.length ? `<p><strong>Dificultades ocasionales:</strong></p>${ul(an.ocasionales.flatMap(x => x.rs.map(r => x.area + ' — ' + vineta(r))))}` : '');
    const ajustes = p ? [...Object.entries(p.aula), ...Object.entries(p.apoyos)].filter(([, x]) => x.adecuacion).map(([k, x]) => k + ': ' + x.adecuacion) : [];
    s += h('Apoyos implementados') + (an.apoyos.length ? ul(an.apoyos.map(vineta)) : vacio('No hay registros marcados como apoyo brindado.')) + (ajustes.length ? `<p><strong>Adecuaciones previstas en el plan de intervención:</strong></p>${ul(ajustes)}` : '');
    s += h('Avances: cambio en el nivel de apoyo') + (an.evol.length ? ul(an.evol.map(textoEvol)) : vacio('Se necesitan al menos dos registros con nivel de apoyo en una misma área para mostrar el avance.'));
    s += h('Comunicación con la familia') + (an.familia.length ? ul(an.familia.map(vineta)) : vacio('Sin registros de orientación a la familia en el periodo.'));
    const rec = recomendaciones(an);
    s += h('Recomendaciones') + `<div contenteditable="true">${rec.length ? ul(rec) : 'Escriba aquí las recomendaciones.'}</div>`;
  }
  s += h('Acuerdos') + '<div contenteditable="true">Escriba aquí los acuerdos.</div>';
  s += firmas([esc(USUARIO.nombre) + '<br>' + esc(CAT.roles[USUARIO.rol]), fam ? 'Docente de grupo' : 'Vo. Bo. Director(a) de la USAER<br>' + esc(DB.usaer.directora)]) + firmas(['Vo. Bo. Dirección escolar<br>' + esc(e.director || ''), 'Madre, padre o tutor (enterado)']);
  if (!fam && an.regs.length) s += `<div class="salto"></div><h2>Anexo · Registro cronológico del periodo</h2><table><tr><th style="width:13%">Fecha</th><th>Actividad</th><th>Observación</th><th style="width:20%">Registró</th></tr>${an.regs.map(r => `<tr><td>${esc(fcorta(r.fecha))}</td><td>${esc(r.actividad)}</td><td>${esc(r.observacion)}${r.nivel ? ' <em>(' + esc(r.nivel) + ')</em>' : ''}</td><td>${esc(nomUsuario(r.usuarioId))}</td></tr>`).join('')}</table><p>Evidencias guardadas en el periodo: <strong>${nEv}</strong>.</p>`;
  return s;
}
function verInforme(inf, nuevo) {
  const a = porId('alumnos', inf.alumnoId) || { nombre: '' };
  visorDoc(inf.tipo + ' · ' + a.nombre, inf.html, 'Informe_' + inf.tipo + '_' + a.nombre, html => { inf.html = html; if (nuevo && !porId('informes', inf.id)) DB.informes.push(inf); guardar('Informe guardado: ' + inf.tipo); aviso('Informe guardado en el expediente.'); pintar(); });
}
function nuevoInforme(alumnoId) {
  if (!activos().length) { aviso('No hay alumnos en atención.'); return; }
  const v = formulario('Generar informe', [{ k: 'alumnoId', label: 'Alumno', tipo: 'select', req: 1, opciones: activos().sort((a, b) => a.nombre.localeCompare(b.nombre)).map(a => [a.id, a.nombre]) }, { k: 'tipo', label: 'Tipo de informe', tipo: 'select', req: 1, opciones: CAT.tiposInforme, ayuda: 'A los alumnos sin diagnóstico solo se les hace el informe final del ciclo.' }, { k: 'desde', label: 'Desde', tipo: 'date', req: 1 }, { k: 'hasta', label: 'Hasta', tipo: 'date', req: 1 }],
    { alumnoId: alumnoId || '' },
    o => verInforme({ id: uid(), alumnoId: o.alumnoId, tipo: o.tipo, desde: o.desde, hasta: o.hasta, fecha: hoy(), usuarioId: USUARIO.id, html: armarInforme(porId('alumnos', o.alumnoId), o.tipo, o.desde, o.hasta) }, true),
    '<p class="nota">El informe se arma con los registros del periodo: los marcados como <strong>logro</strong>, <strong>dificultad</strong> o <strong>apoyo brindado</strong>, y los cambios en el <strong>nivel de apoyo</strong>.</p>');
  const periodo = () => { const p = periodoInforme($('#f_tipo', v).value); $('#f_desde', v).value = p[0]; $('#f_hasta', v).value = p[1]; };
  const tipos = () => { const ts = tiposInformeDe(porId('alumnos', $('#f_alumnoId', v).value)); $('#f_tipo', v).innerHTML = ts.map(t => `<option>${esc(t)}</option>`).join(''); periodo(); };
  $('#f_alumnoId', v).onchange = tipos; $('#f_tipo', v).onchange = periodo; tipos();
}
function tablaInformes(cont, xs) {
  cont.innerHTML = xs.length ? `<div class="tabla-scroll"><table><tr><th>Fecha</th><th>Alumno</th><th>Tipo</th><th>Periodo</th><th>Elaboró</th><th></th></tr>${xs.slice().reverse().map(i => `<tr><td>${esc(fcorta(i.fecha))}</td><td>${esc((porId('alumnos', i.alumnoId) || {}).nombre || '')}</td><td>${esc(i.tipo)}</td><td>${esc(fcorta(i.desde))} – ${esc(fcorta(i.hasta))}</td><td>${esc(nomUsuario(i.usuarioId))}</td><td><button class="chico" data-ver="${i.id}">Abrir</button></td></tr>`).join('')}</table></div>` : '<p>Todavía no hay informes guardados.</p>';
  cont.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => verInforme(porId('informes', b.dataset.ver), false));
}
function tInformes(t, a) {
  t.innerHTML = `<div class="fila"><h2>Informes</h2><span class="sep"></span>${ed('<button id="gi">Generar informe</button>')}</div><p>El informe analiza el registro cronológico: fortalezas, dificultades persistentes, apoyos, avance en el nivel de apoyo y recomendaciones. Todo se puede corregir antes de guardar.</p><div id="li"></div>`;
  tablaInformes($('#li', t), DB.informes.filter(i => i.alumnoId === a.id));
  if ($('#gi', t)) $('#gi', t).onclick = () => nuevoInforme(a.id);
}
function vInformes(v) {
  const sin = activos().filter(a => !DB.informes.some(i => i.alumnoId === a.id));
  v.innerHTML = `<div class="fila"><h1>Informes</h1><span class="sep"></span>${ed('<button id="gi">Generar informe</button>')}</div>
  ${sin.length ? `<div class="caja alerta"><strong>Alumnos sin informe en el expediente (${sin.length}):</strong> ${sin.map(a => `<a href="#alumno/${a.id}/informes">${esc(a.nombre)}</a>`).join(' · ')}</div>` : ''}<div id="li"></div>`;
  tablaInformes($('#li'), DB.informes);
  if ($('#gi')) $('#gi').onclick = () => nuevoInforme();
}

/* ---------- Arranque ---------- */
(async function () {
  await abrirIDB();
  const previo = await leerEstado();
  if (previo && Array.isArray(previo.alumnos)) { DB = migrar(previo); if (previo.version !== DB.version) await idbOp('kv', 'readwrite', s => s.put(DB, 'estado')); }
  calcularHuellas();
  pantallaAcceso();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
})();

</script>
